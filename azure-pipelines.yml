trigger:
- master

pool:
  vmImage: 'ubuntu-latest'
stages:
- stage: Build
  jobs:
    - job: firstjob
      steps:
      - bash: echo Build First Job
      - bash: echo $(Pipeline.Workspace) - workspace
      - bash: echo $(Build.BuildNumber) - buildnumber
      - bash: echo $(Build.BuildId) - build id
      - bash: echo $(Build.SourceBranchName) - source branch name
      - bash: echo $(Build.SourcesDirectory) - source directory
      - bash: echo $(System.DefaultWorkingDirectory) - Default directory
      - bash: ls -r  $(System.DefaultWorkingDirectory)
      - bash: echo $(Build.ArtifactStagingDirectory) - artifacts staging directory